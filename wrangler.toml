name = "afmcph"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "afmc-picklehub"
# database_id will be added after D1 database creation with: wrangler d1 create afmc-picklehub

# Environment variables
[vars]
ENVIRONMENT = "development"